name: CI

on:
  push:
  pull_request:

jobs:
  live-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize
        run: |
          curl --fail-with-body -i -sS https://chatgpt-ask-user-mcp.zhangjm.workers.dev/mcp             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-debug","version":"1.0.0"}}}'
      - name: List tools
        run: |
          curl --fail-with-body -i -sS https://chatgpt-ask-user-mcp.zhangjm.workers.dev/mcp             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
      - name: Call ask_user
        run: |
          curl --fail-with-body -i -sS https://chatgpt-ask-user-mcp.zhangjm.workers.dev/mcp             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ask_user","arguments":{"question":"Test: does Ask User work?","options":[{"label":"Yes","value":"yes"},{"label":"No","value":"no"}]}}}'
