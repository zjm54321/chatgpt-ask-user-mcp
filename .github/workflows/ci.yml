name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Diagnose live MCP without Origin
        run: |
          curl --fail-with-body -i -sS https://chatgpt-ask-user-mcp.zhangjm.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-debug","version":"1.0.0"}}}'
      - name: Diagnose live MCP with ChatGPT Origin
        run: |
          curl --fail-with-body -i -sS https://chatgpt-ask-user-mcp.zhangjm.workers.dev/mcp \
            -H 'Origin: https://chatgpt.com' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-debug","version":"1.0.0"}}}'
